<head>
    <meta charset="UTF-8">

<body>
    <header class="cabecalho container">
        <a href="/index.html"><img class="cabecalho__logo" src="/css/imagens/Logo.png"
                alt="Logo do site e voltar ao inicio"></a>
        <nav class="cabecalho__navegacao">
            <ul>
                <li class="cabecalho__itens"><a class="cabecalho__link" href="/index.html">Sobre o Curso</a></li>
            </ul>
        </nav>
    </header>
    <section class="contato container">
        <div>
            <form action="https://uniqueingles.us14.list-manage.com/subscribe/post?u=27c527ffaa9b57865239f24e3&amp;id=ab9bd94f76" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate>
                <div class="contato__box">
                    <label class="contato__box--label" for="name">Name</label>
                    <input type="text" id="name" name="FNAME" class="contato__box--input" required placeholder="Name">
                </div>
                <div class="contato__box">
                    <label class="contato__box--label" for="email">Email</label>
                    <input type="email" id="email" name="EMAIL" class="contato__box--input" required
                        placeholder="seuemail@dominio.com">
                </div>
                <div class="contato__box">
                    <label class="contato__box--label" for="telefone">Tell</label>
                    <input type="tel" id="tell" name="PHONE" class="contato__box--input" required
                        pattern="^\(?\d{2}\)?[\s-]?[\s9]?\d{4}-?\d{4}$" placeholder="(xx)xxxxx-xxxx">
                    <label class="contato__box--label contato"  for="mensagem">O que você gostaria de perguntar?</label>
                </div>
                <div class="contato__box">
                    <textarea cols="70" rows="10" id="menssage" name="MMERGE2" class="contato__areaTexto" required></textarea>
                    <input type="submit" value="Enviar" class="contato__botao">
                </div>
            </form>
        </div>
    </section>

    <footer class="rodape container">
        <ul class="rodape__sociais">
            <li><a href="https://www.instagram.com/ericaformaio/"><img class="rodape__sociais--instagram" src="/css/imagens/imgInstagram.png"
                        alt="logo Instagram"></a></li>
            <li><a href="mailto:contato@uniqueingles.com"><img class="rodape__sociais--email" src="/css/imagens/imgEmail.png"
                        alt="envelope aberto com simbolo de uso de email"></a></li>
        </ul>
        <div class="rodape__fimDaPagina">
            <a href="/index.html"><img src="/css/imagens/Logo.png" alt="Logo do site e voltar ao inicio"
                    class="rodape__logo"></a>
            <p class="rodape__copyright">&copy; Copyright Edson Raines - 2022</p>
        </div>
    </footer>
