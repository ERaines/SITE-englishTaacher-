<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/assents/reset.css">
    <link rel="stylesheet" href="/css/assents/base.css">
    <link rel="stylesheet" href="/css/assents/contato.css">
    <link rel="stylesheet" href="/css/assents/cabecalho.css">
    <link rel="stylesheet" href="/css/assents/rodape.css">
</head>
<body>
    <header class="cabecalho container">
        <a href="/index.html"><img class="cabecalho__logo" src="/css/imagens/Logo.png" alt="Logo do site e voltar ao inicio"></a>
        <nav class="cabecalho__navegacao">
            <ul>
                <li class="cabecalho__itens"><a class="cabecalho__link" href="/index.html">Sobre o Curso</a></li>
            </ul>
        </nav>
    </header>
    <section class="contato container">
        <div>
            <form>
                <div class="contato__box">
                    <label class="contato__box--label" for="name">Name</label>
                    <input type="text" id="name" class="contato__box--input" required placeholder="Name">
                </div>
                <div class="contato__box">
                    <label class="contato__box--label" for="email">Email</label>
                    <input type="email" id="email" class="contato__box--input" required placeholder="seuemail@dominio.com">
                </div>
                <div class="contato__box">
                    <label class="contato__box--label" for="telefone">Tell</label>
                    <input type="tel" id="tell" class="contato__box--input" required
                        pattern="^\(?\d{2}\)?[\s-]?[\s9]?\d{4}-?\d{4}$" placeholder="(xx)xxxxx-xxxx">
                    <label class="contato__box--label contato" for="mensagem">O que você gostaria de perguntar?</label>
                </div>
                <div class="contato__box">
                    <textarea cols="70" rows="10" id="menssage" class="contato__areaTexto" required></textarea>
                    <input type="submit" value="Enviar" class="contato__botao">
                </div>
            </form>
        </div>
    </section>
    <footer class="rodape container">
        <ul class="rodape__sociais">
            <li><a href="/index.html"><img class="rodape__sociais--instagram" src="/css/imagens/imgInstagram.png" alt="logo Instagram"></a></li>
            <li><a href="mailto:contato@email.com"><img class="rodape__sociais--email" src="/css/imagens/imgEmail.png" alt="envelope aberto com simbolo de uso de email"></a></li>
        </ul>
        <div class="rodape__fimDaPagina">
            <a href="/index.html"><img src="/css/imagens/LogoRodape.png" alt="Logo do site e voltar ao inicio" class="rodape__logo"></a>
            <p class="rodape__copyright">&copy; Copyright Edson Raines - 2022</p>
        </div>
    </footer>
</body>
</html>
